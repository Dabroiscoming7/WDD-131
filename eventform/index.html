<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main>
        <div class="event-box">
            <form id="event-form" novalidate>
                <h1>Event Ticket</h1>

                <div class="name-row">
                    <div class="form-field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="firstName" required>
                    </div>
                    <div class="form-field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="lastName" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="details-row">
                    <div class="form-field">
                        <label for="participant-type">Type</label>
                        <select id="participant-type" name="participantType" required>
                            <option value="">Choose one</option>
                            <option value="student">Student</option>
                            <option value="guest">Guest</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="event-date">Event Date</label>
                        <input type="date" id="event-date" name="eventDate" required>
                    </div>
                </div>

                <div id="participant-info" class="form-field" hidden>
                    <label id="participant-label" for="participant-value"></label>
                    <input type="text" id="participant-value" name="participantValue">
                </div>

                <button type="submit">Create Ticket</button>
                <div id="form-errors" aria-live="polite"></div>
            </form>

            <section id="ticket" aria-live="polite" hidden>
                <h2>Ticket Created</h2>
                <p id="ticket-name"></p>
                <p id="ticket-type"></p>
                <p id="ticket-date"></p>
            </section>
        </div>
    </main>
</body>
</html>
